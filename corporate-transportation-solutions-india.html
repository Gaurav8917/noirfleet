  <script>
  (function(){
    var SLUG='corporate-transportation-solutions-india';
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function readTime(c){var w=(c||'').replace(/<[^>]*>/g,' ').split(/\s+/).filter(Boolean).length;return Math.max(1,Math.round(w/200))+' min read';}
    var articles=window.NF_ARTICLES||[];
    var article=null;
    for(var i=0;i<articles.length;i++){if(articles[i].slug===SLUG){article=articles[i];break;}}
    var root=document.getElementById('article-root');
    if(!article){root.innerHTML='<div class="not-found"><h2>Article not found</h2><p>This article may have moved.</p><a href="blog.html" style="color:var(--gold)">Back to Journal</a></div>';return;}
    var related=articles.filter(function(a){return a.slug!==article.slug&&a.category===article.category;}).slice(0,3);
    if(related.length<3){var others=articles.filter(function(a){return a.slug!==article.slug&&a.category!==article.category;});related=related.concat(others).slice(0,3);}
    var coverImg=article.image?'<img class="article-cover" src="'+esc(article.image)+'" alt="'+esc(article.title)+'">':'';
    var relatedHTML='';
    if(related.length){relatedHTML='<div class="related-section"><h3>More from the Journal</h3><div class="related-grid">'+related.map(function(r){var rImg=r.image?'<img src="'+esc(r.image)+'" alt="'+esc(r.title)+'">':'';return'<a class="related-card" href="'+r.slug+'.html">'+rImg+'<div class="related-card-body"><div class="related-card-cat">'+esc(r.category||'')+'</div><h4>'+esc(r.title)+'</h4></div></a>';}).join('')+'</div></div>';}
    root.innerHTML='<header class="article-hero"><span class="article-eyebrow">'+esc(article.category||'')+'</span><h1>'+esc(article.title)+'</h1><div class="article-hero-meta"><span>'+esc(article.date||'')+'</span><span class="dot">·</span><span>'+readTime(article.content)+'</span></div><div class="article-breadcrumb"><a href="index.html">Home</a><span>/</span><a href="blog.html">Journal</a><span>/</span>'+esc(article.title)+'</div></header>'+coverImg+'<div class="article-outer"><a class="back-link" href="blog.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Back to Journal</a><div class="article-body-content">'+( article.content||'')+'</div><div class="article-cta"><h2>Ready to travel with NoirFleet?</h2><p>Premium chauffeurs, worldwide. Book your ride or explore our fleet.</p><div class="btn-row"><a class="btn primary" href="contact.html">Book Your Ride</a><a class="btn outline" href="fleet.html">View Fleet</a></div></div>'+relatedHTML+'</div>';
  })();
