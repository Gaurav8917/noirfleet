  <script>
  (function() {
    var SLUG = "sports-tourism-transportation-guide";

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    }

    function readTime(c) {
      var w = (c || "").replace(/<[^>]*>/g," ").split(/\s+/).filter(Boolean).length;
      return Math.max(1,Math.round(w / 200)) + " min read";
    }

    var articles = window.NF_ARTICLES || [];
    var article = null;

    for (var i = 0; i < articles.length; i++) {
      if (articles[i].slug === SLUG) {
        article = articles[i];
        break;
      }
    }

    var root = document.getElementById("article-root");

    if (!article) {
      root.innerHTML =
        "<div style='text-align:center;padding:80px 24px;color:var(--text-muted)'>" +
        "<h2 style='font-family:Playfair Display,serif;color:var(--text)'>Article not found</h2>" +
        "<p>This article may have moved.</p>" +
        "<a href='blog.html' style='color:var(--gold)'>Back to Journal</a></div>";
      return;
    }

    var coverHTML = article.image
      ? "<img class='article-cover' src='" + esc(article.image) + "' alt='" + esc(article.title) + "'>"
      : "";

    root.innerHTML =
      "<header class='article-hero'>" +
        "<span class='article-eyebrow'>" + esc(article.category || "") + "</span>" +
        "<h1>" + esc(article.title) + "</h1>" +
        "<div class='article-hero-meta'>" +
          "<span>" + esc(article.date || "") + "</span>" +
          "<span style='opacity:.35'>·</span>" +
          "<span>" + readTime(article.content) + "</span>" +
        "</div>" +
        "<div class='article-breadcrumb'>" +
          "<a href='index.html'>Home</a><span>/</span>" +
          "<a href='blog.html'>Journal</a><span>/</span>" +
          esc(article.title) +
        "</div>" +
      "</header>" +
      coverHTML +
      "<div class='article-outer'>" +
        "<a class='back-link' href='blog.html'>← Back to Journal</a>" +
        "<div class='article-body-content'>" + (article.content || "") + "</div>" +
        "<div class='article-cta'>" +
          "<h2>Ready to travel with NoirFleet?</h2>" +
          "<p>Premium chauffeurs, worldwide. Book your ride or explore our fleet.</p>" +
          "<div class='btn-row'>" +
            "<a class='btn primary' href='contact.html'>Book Your Ride</a>" +
            "<a class='btn outline' href='fleet.html'>View Fleet</a>" +
          "</div>" +
        "</div>" +
      "</div>";
  })();
  </script>
