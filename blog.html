<body data-page="blog">

  <div id="site-header"></div>

  <main class="page-body">

    <section class="page-hero">
      <img src="city_tours.jpg" alt="" class="page-hero-bg">

    </section>

    <section class="blog-section">
      <div class="blog-toolbar">
        <div class="blog-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="blogSearch" placeholder="Search articles…" aria-label="Search articles">
        </div>
        <div class="blog-tags" id="blogTags"></div>
      </div>

      <div class="blog-grid" id="blogGrid"></div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="articles.js"></script>
  <script src="shared.js"></script>
  <script>
  (function () {
    var articles = (window.NF_ARTICLES || []).slice();
    var grid    = document.getElementById('blogGrid');
    var tagsBox = document.getElementById('blogTags');
    var search  = document.getElementById('blogSearch');

    var activeTag = 'All';
    var query = '';

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ---- Build tag filter list ---- */
    var cats = ['All'];
    articles.forEach(function (a) {
      if (a.category && cats.indexOf(a.category) === -1) cats.push(a.category);
    });
    tagsBox.innerHTML = cats.map(function (c) {
      return '<button class="blog-tag' + (c === 'All' ? ' active' : '') + '" data-tag="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('');
    Array.prototype.forEach.call(tagsBox.querySelectorAll('.blog-tag'), function (btn) {
      btn.addEventListener('click', function () {
        activeTag = btn.getAttribute('data-tag');
        Array.prototype.forEach.call(tagsBox.querySelectorAll('.blog-tag'), function (b) {
          b.classList.toggle('active', b === btn);
        });
        render();
      });
    });

    search.addEventListener('input', function () {
      query = search.value.trim().toLowerCase();
      render();
    });

    function matches(a) {
      if (activeTag !== 'All' && a.category !== activeTag) return false;
      if (!query) return true;
      var hay = (a.title + ' ' + a.excerpt + ' ' + (a.category || '')).toLowerCase();
      return hay.indexOf(query) !== -1;
    }

    function card(a, featured) {
      var img = a.image
        ? '<img src="' + esc(a.image) + '" alt="' + esc(a.title) + '" onerror="this.style.display=\'none\'">'
        : '';
      return '' +
        '<a class="article-card' + (featured ? ' featured' : '') + '" href="article.html?slug=' + encodeURIComponent(a.slug) + '">' +
          '<div class="article-thumb">' + img +
            (a.category ? '<span class="article-cat-pill">' + esc(a.category) + '</span>' : '') +
          '</div>' +
          '<div class="article-body">' +
            '<div class="article-meta"><span>' + esc(a.date || '') + '</span></div>' +
            '<h3>' + esc(a.title) + '</h3>' +
            '<p class="article-excerpt">' + esc(a.excerpt || '') + '</p>' +
            '<span class="article-readmore">Read article →</span>' +
          '</div>' +
        '</a>';
    }

    function render() {
      var list = articles.filter(matches);
      if (!list.length) {
        grid.innerHTML = '<div class="blog-empty"><p>No articles match your search yet.</p></div>';
        return;
      }
      grid.innerHTML = list.map(function (a, i) {
        return card(a, i === 0 && activeTag === 'All' && !query);
      }).join('');
    }

    render();
  })();
  </script>
