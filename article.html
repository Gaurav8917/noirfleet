<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- ═══ SEO BASE TAGS — overwritten by JS per article ═══ -->
  <title>NoirFleet — Premium Chauffeur &amp; Luxury Transport</title>
  <meta name="description" content="NoirFleet provides premium chauffeur and luxury transport services worldwide — airport transfers, corporate travel, weddings and VIP event transport.">
  <meta name="robots" content="index,follow">
  <meta name="author" content="NoirFleet">
  <link rel="canonical" href="https://www.noirfleet.com/article.html">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="NoirFleet">
  <meta property="og:title" content="NoirFleet — Premium Chauffeur &amp; Luxury Transport">
  <meta property="og:description" content="NoirFleet provides premium chauffeur and luxury transport services worldwide.">
  <meta property="og:url" content="https://www.noirfleet.com/article.html">
  <meta property="og:image" content="https://www.noirfleet.com/banner.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NoirFleet — Premium Chauffeur &amp; Luxury Transport">
  <meta name="twitter:description" content="NoirFleet provides premium chauffeur and luxury transport services worldwide.">
  <meta name="twitter:image" content="https://www.noirfleet.com/banner.png">

  <!-- JSON-LD: Article + BreadcrumbList — overwritten by JS -->
  <script type="application/ld+json" id="article-schema">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "name": "NoirFleet Journal",
    "publisher": {
      "@type": "Organization",
      "name": "NoirFleet",
      "logo": { "@type": "ImageObject", "url": "https://www.noirfleet.com/logo.jpg" }
    }
  }
  </script>
  <script type="application/ld+json" id="breadcrumb-schema">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.noirfleet.com/" },
      { "@type": "ListItem", "position": 2, "name": "Journal", "item": "https://www.noirfleet.com/blog.html" }
    ]
  }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="icon" type="image/png" href="noir_favicon.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --gold: #ffd166;
      --dark: #0e0e10;
      --surface: #16161a;
      --surface-2: #1c1c22;
      --border: rgba(255,255,255,0.08);
      --text: #f0ede6;
      --text-muted: rgba(240,237,230,0.55);
    }

    /* ── HERO ── */
    .article-hero {
      background: var(--dark);
      border-bottom: 1px solid var(--border);
      padding: 64px 24px 52px;
      text-align: center;
    }
    .article-eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      padding: 5px 14px;
      border: 1px solid rgba(255,209,102,0.25);
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .article-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 4.5vw, 48px);
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
      max-width: 820px;
      margin: 0 auto 18px;
    }
    .article-hero-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .article-hero-meta .dot { opacity: 0.35; }
    .article-breadcrumb {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .article-breadcrumb a { color: var(--gold); text-decoration: none; }
    .article-breadcrumb span { margin: 0 6px; opacity: 0.4; }

    /* ── HERO IMAGE ── */
    .article-cover {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      display: block;
    }

    /* ── BODY ── */
    .article-outer {
      max-width: 780px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }
    .article-outer p {
      font-size: 17px;
      line-height: 1.8;
      color: rgba(240,237,230,0.88);
      margin-bottom: 1.5rem;
    }
    .article-outer h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 700;
      color: var(--text);
      margin: 2.8rem 0 1rem;
      line-height: 1.25;
    }
    .article-outer h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 2rem 0 0.7rem;
    }
    .article-outer ul, .article-outer ol {
      padding-left: 20px;
      margin-bottom: 1.5rem;
    }
    .article-outer li {
      font-size: 16px;
      line-height: 1.75;
      color: rgba(240,237,230,0.85);
      margin-bottom: 0.5rem;
    }
    .article-outer blockquote {
      border-left: 3px solid var(--gold);
      margin: 2.5rem 0;
      padding: 18px 24px;
      background: var(--surface);
      border-radius: 0 8px 8px 0;
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      font-style: italic;
      color: var(--text);
      line-height: 1.55;
    }
    .article-outer a { color: var(--gold); text-decoration: none; }
    .article-outer a:hover { text-decoration: underline; }
    .article-outer strong { color: var(--text); font-weight: 600; }
    .article-outer hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 3rem 0;
    }
    .article-outer img {
      width: 100%;
      border-radius: 8px;
      margin: 1.5rem 0;
    }

    /* ── TABLE ── */
    .article-outer table {
      width: 100%;
      border-collapse: collapse;
      margin: 2rem 0;
      font-size: 15px;
    }
    .article-outer th {
      background: var(--surface);
      color: var(--gold);
      font-weight: 600;
      padding: 12px 16px;
      text-align: left;
      border: 1px solid var(--border);
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .article-outer td {
      padding: 11px 16px;
      border: 1px solid var(--border);
      color: rgba(240,237,230,0.85);
      vertical-align: top;
      line-height: 1.55;
    }
    .article-outer tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    /* ── BACK LINK ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: 40px;
    }
    .back-link:hover { opacity: 0.8; }

    /* ── CTA ── */
    .article-cta {
      background: var(--surface);
      border: 1px solid rgba(255,209,102,0.2);
      border-radius: 14px;
      padding: 40px 36px;
      text-align: center;
      margin-top: 3.5rem;
    }
    .article-cta h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 10px;
    }
    .article-cta p {
      color: var(--text-muted);
      font-size: 15px;
      margin: 0 0 24px;
    }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn.primary { background: var(--gold); color: #0e0e10; }
    .btn.outline { border: 1px solid rgba(255,209,102,0.4); color: var(--gold); }

    /* ── NOT FOUND ── */
    .not-found {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }
    .not-found h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--text);
      margin-bottom: 12px;
    }

    /* ── RELATED ── */
    .related-section {
      border-top: 1px solid var(--border);
      padding-top: 48px;
      margin-top: 48px;
    }
    .related-section h3 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 24px;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .related-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
    }
    .related-card:hover {
      border-color: rgba(255,209,102,0.3);
      transform: translateY(-2px);
    }
    .related-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
      margin: 0;
      border-radius: 0;
    }
    .related-card-body { padding: 14px 16px 16px; }
    .related-card-cat {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .related-card h4 {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin: 0;
    }

    @media (max-width: 600px) {
      .article-hero { padding: 48px 20px 40px; }
      .article-outer { padding: 36px 20px 60px; }
      .article-cta { padding: 28px 20px; }
      .article-outer blockquote { font-size: 17px; padding: 14px 18px; }
      .article-outer table { font-size: 13px; }
      .article-outer th, .article-outer td { padding: 9px 11px; }
    }
  </style>
</head>
<body data-page="article">

  <div id="site-header"></div>
  <div id="article-root"></div>
  <div id="site-footer"></div>

  <script src="articles.js"></script>
  <script src="shared.js"></script>
  <script>
  (function () {

    var BASE_URL = 'https://www.noirfleet.com/';

    /* ── helpers ── */
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return String(s == null ? '' : s).replace(/"/g,'&quot;');
    }
    function readTime(content) {
      var words = (content || '').replace(/<[^>]*>/g,' ').split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.round(words / 200)) + ' min read';
    }
    function getSlug() {
      var params = new URLSearchParams(window.location.search);
      return params.get('slug') || '';
    }
    function setMeta(name, value) {
      var el = document.querySelector('meta[name="' + name + '"]');
      if (el) el.setAttribute('content', escAttr(value));
    }
    function setOG(prop, value) {
      var el = document.querySelector('meta[property="' + prop + '"]');
      if (el) el.setAttribute('content', escAttr(value));
    }
    function setTwitter(name, value) {
      var el = document.querySelector('meta[name="' + name + '"]');
      if (el) el.setAttribute('content', escAttr(value));
    }

    /* ── find article ── */
    var articles = window.NF_ARTICLES || [];
    var slug = getSlug();
    var article = null;
    for (var i = 0; i < articles.length; i++) {
      if (articles[i].slug === slug) { article = articles[i]; break; }
    }

    var root = document.getElementById('article-root');

    /* ── NOT FOUND ── */
    if (!article) {
      root.innerHTML =
        '<div class="not-found">' +
          '<h2>Article not found</h2>' +
          '<p>This article may have moved or been removed.</p>' +
          '<a href="blog.html" style="color:var(--gold)">← Back to Journal</a>' +
        '</div>';
      return;
    }

    /* ══════════════════════════════════════════
       UPDATE ALL HEAD META TAGS DYNAMICALLY
       This is what Google needs to index correctly
    ══════════════════════════════════════════ */

    var pageTitle  = article.title + ' | NoirFleet';
    var pageDesc   = article.excerpt || article.title;
    var pageURL    = BASE_URL + 'article.html?slug=' + encodeURIComponent(article.slug);
    var pageImage  = article.image
                     ? BASE_URL + article.image
                     : BASE_URL + 'banner.png';

    /* Title */
    document.title = pageTitle;

    /* Canonical */
    var canonEl = document.querySelector('link[rel="canonical"]');
    if (canonEl) canonEl.setAttribute('href', pageURL);

    /* Meta description */
    setMeta('description', pageDesc);

    /* Open Graph */
    setOG('og:title',       pageTitle);
    setOG('og:description', pageDesc);
    setOG('og:url',         pageURL);
    setOG('og:image',       pageImage);

    /* Twitter */
    setTwitter('twitter:title',       pageTitle);
    setTwitter('twitter:description', pageDesc);
    setTwitter('twitter:image',       pageImage);

    /* ══════════════════════════════════════════
       JSON-LD: Article Schema
    ══════════════════════════════════════════ */
    var articleSchema = {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": article.title,
      "description": pageDesc,
      "url": pageURL,
      "datePublished": article.date || "",
      "dateModified": article.date || "",
      "author": {
        "@type": "Organization",
        "name": "NoirFleet"
      },
      "publisher": {
        "@type": "Organization",
        "name": "NoirFleet",
        "logo": {
          "@type": "ImageObject",
          "url": BASE_URL + "logo.jpg"
        }
      },
      "image": pageImage,
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": pageURL
      }
    };
    var schemaEl = document.getElementById('article-schema');
    if (schemaEl) schemaEl.textContent = JSON.stringify(articleSchema);

    /* ══════════════════════════════════════════
       JSON-LD: BreadcrumbList Schema
    ══════════════════════════════════════════ */
    var breadcrumbSchema = {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": BASE_URL
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Journal",
          "item": BASE_URL + "blog.html"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": article.title,
          "item": pageURL
        }
      ]
    };
    var breadcrumbEl = document.getElementById('breadcrumb-schema');
    if (breadcrumbEl) breadcrumbEl.textContent = JSON.stringify(breadcrumbSchema);

    /* ══════════════════════════════════════════
       RELATED ARTICLES
    ══════════════════════════════════════════ */
    var related = articles.filter(function(a) {
      return a.slug !== article.slug && a.category === article.category;
    }).slice(0, 3);
    if (related.length < 3) {
      var others = articles.filter(function(a) {
        return a.slug !== article.slug && a.category !== article.category;
      });
      related = related.concat(others).slice(0, 3);
    }

    /* ══════════════════════════════════════════
       RENDER PAGE
    ══════════════════════════════════════════ */
    var coverImg = article.image
      ? '<img class="article-cover" src="' + esc(article.image) + '" alt="' + esc(article.title) + '" onerror="this.style.display=\'none\'">'
      : '';

    var relatedHTML = '';
    if (related.length) {
      relatedHTML =
        '<div class="related-section">' +
          '<h3>More from the Journal</h3>' +
          '<div class="related-grid">' +
          related.map(function(r) {
            var rImg = r.image
              ? '<img src="' + esc(r.image) + '" alt="' + esc(r.title) + '" onerror="this.style.display=\'none\'">'
              : '';
            return '<a class="related-card" href="article.html?slug=' + encodeURIComponent(r.slug) + '">' +
              rImg +
              '<div class="related-card-body">' +
                '<div class="related-card-cat">' + esc(r.category || '') + '</div>' +
                '<h4>' + esc(r.title) + '</h4>' +
              '</div>' +
            '</a>';
          }).join('') +
          '</div>' +
        '</div>';
    }

    root.innerHTML =
      /* HERO */
      '<header class="article-hero" itemscope itemtype="https://schema.org/Article">' +
        (article.category ? '<span class="article-eyebrow">' + esc(article.category) + '</span>' : '') +
        '<h1 itemprop="headline">' + esc(article.title) + '</h1>' +
        '<div class="article-hero-meta">' +
          '<span itemprop="datePublished">' + esc(article.date || '') + '</span>' +
          '<span class="dot">·</span>' +
          '<span>' + readTime(article.content) + '</span>' +
        '</div>' +
        '<div class="article-breadcrumb">' +
          '<a href="index.html">Home</a><span>/</span>' +
          '<a href="blog.html">Journal</a><span>/</span>' +
          esc(article.title) +
        '</div>' +
      '</header>' +

      /* COVER IMAGE */
      coverImg +

      /* BODY */
      '<div class="article-outer">' +
        '<a class="back-link" href="blog.html">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>' +
          'Back to Journal' +
        '</a>' +

        '<div class="article-body-content" itemprop="articleBody">' + (article.content || '') + '</div>' +

        '<div class="article-cta">' +
          '<h2>Ready to travel with NoirFleet?</h2>' +
          '<p>Premium chauffeurs, worldwide. Book your ride or explore our fleet.</p>' +
          '<div class="btn-row">' +
            '<a class="btn primary" href="contact.html">Book Your Ride</a>' +
            '<a class="btn outline" href="fleet.html">View Fleet</a>' +
          '</div>' +
        '</div>' +

        relatedHTML +

      '</div>';

  })();
  </script>

</body>
</html>
